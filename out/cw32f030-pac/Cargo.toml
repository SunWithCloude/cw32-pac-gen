[package]
name = "cw32f030-pac"
version = "0.1.0"
edition = "2021"
rust-version = "1.60"
description = "Zero-dependency register access crate (PAC) for the CW32F030 Cortex-M0+ MCU, generated by cw32-pac-gen from the vendor SDK headers (Apache-2.0)"
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["cw32", "cw32f030", "pac", "register", "cortex-m"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
cortex-m-rt = { version = "0.7", optional = true, features = ["device"] }

[features]
rt = ["dep:cortex-m-rt"]
