[dev-dependencies]
# 示例直接依赖:rt 模块只有数据、不引用其符号,不加的话 rustc 不会把
# rlib 传给链接器,link.x 的 DefaultHandler_ 会缺;示例里还要 use _; 强制引用
cortex-m-rt = { version = "0.7", features = ["device"] }

[package]
name = "cw32l031-pac"
version = "0.1.0"
edition = "2021"
rust-version = "1.60"
description = "Zero-dependency register access crate (PAC) for the CW32L031 Cortex-M0+ MCU, generated by cw32-pac-gen from the vendor SDK headers (Apache-2.0)"
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["cw32", "cw32l031", "pac", "register", "cortex-m"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
cortex-m-rt = { version = "0.7", optional = true, features = ["device"] }

[features]
rt = ["dep:cortex-m-rt"]
